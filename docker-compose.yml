# docker-compose.yml
# ===========================================================================
# Declares the containers that make up our local system and how they relate.
# `docker compose up` reads this file and starts everything: the infrastructure
# (Kafka + Postgres), one-shot init containers, and the services. This file is
# GIVEN — read the comments to understand it; it grows a little each lesson.
# ===========================================================================

services:
  # --- Kafka: the message log future lessons publish/consume from. ----------
  # Runs in KRaft mode (no Zookeeper). Single broker — fine for learning.
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"   # broker reachable in the compose network as kafka:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-node settings (no replication possible with one broker):
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created on purpose by topic-init, never implicitly (lesson 3).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      # "ready" = the broker answers an API request. Compose uses this to gate
      # other services (see hello.depends_on).
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # --- topic-init: one-shot. Creates Kafka topics with explicit partitions. --
  # Auto-create is off on the broker, so topics are created here deliberately.
  # `orders` gets 3 partitions; the message key (order_id) picks the partition.
  topic-init:
    image: apache/kafka:3.8.0
    container_name: topic-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic orders --partitions 3 --replication-factor 1
        echo "topics now:"; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  # --- Postgres: the database later lessons read/write. ---------------------
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orders}
      POSTGRES_DB: ${POSTGRES_DB:-orders}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orders} -d ${POSTGRES_DB:-orders}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- hello: the throwaway app from lesson 1 (your first container). -------
  # Kept as a reference example; the real service is order-ingest below.
  hello:
    build: ./hello
    container_name: hello
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # --- order-ingest: the first REAL service (lesson 2). ---------------------
  # An HTTP API that accepts orders. You write its Dockerfile (step 3) and its
  # POST /orders handler (step 2). It waits for infra to be healthy first.
  # (A /healthz-based container healthcheck is added in the observability lesson.)
  order-ingest:
    build: ./order-ingest
    container_name: order-ingest
    ports:
      - "${ORDER_INGEST_PORT:-8080}:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      KAFKA_BOOTSTRAP: kafka:9092      # where the producer connects (lesson 3)
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully   # wait until the topic exists

  # --- order-processor: consumes OrderCommands (lesson 4). ------------------
  # A background worker (no public API; just /healthz internally). This lesson
  # it consumes and logs; persistence + state machine arrive in lessons 5-6.
  order-processor:
    build: ./order-processor
    container_name: order-processor
    environment:
      ASPNETCORE_URLS: http://+:8080
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
